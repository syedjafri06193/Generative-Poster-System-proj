name: v1

on:
  push:
    paths: ["v1/**", ".github/workflows/v1.yml"]
  pull_request:
    paths: ["v1/**", ".github/workflows/v1.yml"]

defaults:
  run:
    working-directory: v1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: v1/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: pip install pikepdf
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Hard-constraint sweep (10,000 seeds)
        run: npm run verify -- 10000

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: v1/package-lock.json }
      - run: npm ci
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium firefox webkit
      - name: Same hashes in Chromium, Firefox and WebKit as in Node
        run: npm run test:browser

  studio:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: v1/package-lock.json }
      - run: npm ci && npm run studio:build
      - uses: actions/upload-pages-artifact@v3
        with: { path: v1/studio/dist }
      - uses: actions/deploy-pages@v4
